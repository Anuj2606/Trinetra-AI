services:

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: trinetra_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD with --env-file backend/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trinetra_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DATABASE_URL: ""
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: trinetra_ai
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD with --env-file backend/.env}
      DATABASE_SSLMODE: prefer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >-
      sh -c "python -m app.database.init_db &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
