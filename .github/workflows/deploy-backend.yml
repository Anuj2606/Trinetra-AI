name: Deploy Trinetra Backend

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ACR_NAME: ca4a568f175bacr
  ACR_LOGIN_SERVER: ca4a568f175bacr.azurecr.io
  CONTAINER_APP_NAME: trinetra-backend
  RESOURCE_GROUP: rg-trinetra-ai
  CONTAINER_ENVIRONMENT: trinetra-env

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Login to Azure Container Registry
        run: |
          az acr login --name $ACR_NAME

      - name: Build and Push Backend Image
        run: |
          IMAGE="$ACR_LOGIN_SERVER/trinetra-backend:${GITHUB_SHA}"
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy Container App
        run: |
          az containerapp create \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --environment "$CONTAINER_ENVIRONMENT" \
            --image "$IMAGE" \
            --registry-server "$ACR_LOGIN_SERVER" \
            --registry-identity system \
            --ingress external \
            --target-port 8000 \
            --cpu 0.5 \
            --memory 1.0Gi \
            --min-replicas 0 \
            --max-replicas 2
