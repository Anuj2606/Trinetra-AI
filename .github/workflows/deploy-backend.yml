name: Deploy Trinetra Backend

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ACR_NAME: ca4a568f175bacr
  ACR_LOGIN_SERVER: ca4a568f175bacr.azurecr.io
  CONTAINER_APP_NAME: trinetra-backend
  RESOURCE_GROUP: rg-trinetra-ai
  CONTAINER_ENVIRONMENT: trinetra-env

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Login to Azure Container Registry
        run: |
          az acr login --name $ACR_NAME

      - name: Build and Push Backend Image
        run: |
          IMAGE="$ACR_LOGIN_SERVER/trinetra-backend:${GITHUB_SHA}"
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy Container App
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE"

          DEPLOYED_IMAGE=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" \
            --output tsv)

          if [ "$DEPLOYED_IMAGE" != "$IMAGE" ]; then
            echo "Container App image mismatch: expected $IMAGE, got $DEPLOYED_IMAGE"
            exit 1
          fi

          az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{name:name,revision:properties.latestRevisionName,image:properties.template.containers[0].image,provisioningState:properties.provisioningState}" \
            --output table

          ACTIVE_IMAGE=$(az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query '[?properties.active == `true` && properties.trafficWeight == `100`].properties.template.containers[0].image | [0]' \
            --output tsv)

          if [ "$ACTIVE_IMAGE" != "$IMAGE" ]; then
            echo "Active revision image mismatch: expected $IMAGE, got $ACTIVE_IMAGE"
            exit 1
          fi

          az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[].{name:name,active:properties.active,traffic:properties.trafficWeight,image:properties.template.containers[0].image}" \
            --output table
