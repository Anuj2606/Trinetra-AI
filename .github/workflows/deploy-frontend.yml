name: Deploy Trinetra Frontend

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ACR_NAME: ca4a568f175bacr
  ACR_LOGIN_SERVER: ca4a568f175bacr.azurecr.io
  CONTAINER_APP_NAME: trinetra-frontend
  RESOURCE_GROUP: rg-trinetra-ai
  CONTAINER_ENVIRONMENT: trinetra-env

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      - name: Build and Push Frontend
        run: |
          IMAGE="$ACR_LOGIN_SERVER/trinetra-frontend:${GITHUB_SHA}"
          docker build \
            --build-arg VITE_API_URL=https://trinetra-backend.victoriousfield-eaef4743.eastasia.azurecontainerapps.io \
            -t "$IMAGE" ./frontend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy Frontend
        run: |
          az containerapp create \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --environment "$CONTAINER_ENVIRONMENT" \
            --image "$IMAGE" \
            --registry-server "$ACR_LOGIN_SERVER" \
            --registry-username "${{ secrets.AZURE_CLIENT_ID }}" \
            --registry-password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --ingress external \
            --target-port 80 \
            --cpu 0.5 \
            --memory 1.0Gi \
            --min-replicas 0 \
            --max-replicas 2
